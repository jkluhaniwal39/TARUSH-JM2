name: Build TARUSH JM APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -q TARUSH-JM-Android16-Source.zip -d source

      - name: Build APK
        run: |
          cd source/TARUSH-JM-Android16
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TARUSH-JM-APK
          path: source/TARUSH-JM-Android16/app/build/outputs/apk/debug/app-debug.apk
